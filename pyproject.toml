[project]
name = "sias"
version = "0.1.0"
description = "Self-improving agentic security: layered prompt-injection and jailbreak detection for local models"
readme = "README.md"
authors = [
    { name = "Hayden-Johnston" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
activations = [
    "safetensors>=0.4.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv.build-backend]
module-name = ["llm_security", "data_processing", "llm_proxy"]
